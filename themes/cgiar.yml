# cgiar theme, the default of maniva-reports.
# Green and mint from the colour themes shown on cgiar.org (November 2026).
# Dark green, amber and pale green from the ICAR-NBPGR deck that inspired the first report.
# This is the team's choice of colours, not an official brand template.
name: cgiar

colours:
  primary: "#06604B"
  primary_dark: "#0F533F"
  highlight: "#58FBD4"
  accent: "#F6A93B"
  accent_dark: "#B45F00"
  tint: "#F3F8EE"
  ink: "#22332A"
  muted: "#4A5A52"
  rule: "#CFE1D8"
  cover_text: "#FFFFFF"
  cover_subtext: "#D9EFE8"
  link_underline: "#9CC9B9"

fonts:
  body: "Inter"
  display: "Inter Display"
  mono: "DejaVu Sans Mono"

# Status chips, Set1. Always printed with the word.
status:
  on_track: "#4DAF4A"
  delayed: "#FF7F00"
  off_track: "#E41A1C"

# ColorBrewer colours for charts
charts:
  single: "#225EA8"        # YlGnBu, one series and the reporting year
  single_light: "#7FCDBB"  # YlGnBu, intervals, secondary bars and earlier years
  not_different: "#8A8A8A" # trials where entries do not differ
  positive: "#2166AC"      # RdBu, for example most preferred or women
  negative: "#B2182B"      # RdBu, for example least preferred or men
  sequential: "YlGnBu"
  diverging: "RdBu"
  qualitative: "Set1"
  map_fill: "#F7F7F7"
  map_focus: "#EDF8B1"
  map_line: "#9A9A9A"
